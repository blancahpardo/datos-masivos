<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="520" fill="#F1E7D6"/>
  <rect x="16" y="16" width="868" height="488" fill="none" stroke="#B5A88F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="450" y="48" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#A23B2E" font-family="Arial, Helvetica, sans-serif" font-weight="bold">DATOS REALES DEL CUADERNO</text>
  <text x="450" y="76" text-anchor="middle" font-size="20" fill="#1E1812" font-weight="bold">Cruce de la base interna con el glosario externo</text>

  <rect x="50" y="115" width="230" height="90" rx="6" fill="#1E1812"/>
  <text x="165" y="145" text-anchor="middle" font-size="13" fill="#F1E7D6" font-family="Arial, Helvetica, sans-serif" font-weight="bold">BASE DE DATOS INTERNA</text>
  <text x="165" y="170" text-anchor="middle" font-size="10.5" fill="#D9CBB0" font-family="Courier New, monospace">terminos_internos.db</text>
  <text x="165" y="188" text-anchor="middle" font-size="10.5" fill="#D9CBB0" font-family="Courier New, monospace">read_sql_query()</text>

  <rect x="50" y="220" width="230" height="90" rx="6" fill="#3A322A"/>
  <text x="165" y="250" text-anchor="middle" font-size="13" fill="#F1E7D6" font-family="Arial, Helvetica, sans-serif" font-weight="bold">GLOSARIO EXTERNO</text>
  <text x="165" y="275" text-anchor="middle" font-size="10.5" fill="#D9CBB0" font-family="Arial, Helvetica, sans-serif">archivo publicado en una URL</text>
  <text x="165" y="293" text-anchor="middle" font-size="10.5" fill="#D9CBB0" font-family="Courier New, monospace">read_csv()</text>

  <path d="M280 160 L 345 205" stroke="#7A6F5C" stroke-width="2" fill="none" marker-end="none"/>
  <path d="M280 265 L 345 220" stroke="#7A6F5C" stroke-width="2" fill="none"/>

  <rect x="350" y="160" width="165" height="105" rx="6" fill="#D2652F"/>
  <text x="432" y="192" text-anchor="middle" font-size="14" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="bold">NORMALIZAR</text>
  <text x="432" y="216" text-anchor="middle" font-size="10.5" fill="#F6E4D6" font-family="Arial, Helvetica, sans-serif">minúsculas, sin</text>
  <text x="432" y="231" text-anchor="middle" font-size="10.5" fill="#F6E4D6" font-family="Arial, Helvetica, sans-serif">espacios sobrantes</text>
  <text x="432" y="252" text-anchor="middle" font-size="9.5" fill="#F6E4D6" font-family="Arial, Helvetica, sans-serif" font-style="italic">el campo que se compara</text>

  <text x="540" y="218" text-anchor="middle" font-size="22" fill="#7A6F5C">→</text>

  <rect x="565" y="160" width="235" height="105" rx="6" fill="#F1E7D6" stroke="#4F7A57" stroke-width="2"/>
  <text x="682" y="195" text-anchor="middle" font-size="14" fill="#3E6146" font-family="Arial, Helvetica, sans-serif" font-weight="bold">CRUCE</text>
  <text x="682" y="222" text-anchor="middle" font-size="10.5" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">informe de cobertura</text>
  <text x="682" y="238" text-anchor="middle" font-size="10.5" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">terminológica</text>
  <text x="682" y="257" text-anchor="middle" font-size="9.5" fill="#7A6F5C" font-family="Arial, Helvetica, sans-serif" font-style="italic">qué términos tienen equivalente</text>

  <rect x="50" y="340" width="750" height="110" rx="6" fill="#EAD9BE"/>
  <text x="425" y="372" text-anchor="middle" font-size="13" fill="#1E1812" font-family="Arial, Helvetica, sans-serif" font-weight="bold">Por qué normalizar antes de cruzar</text>
  <text x="425" y="400" text-anchor="middle" font-size="11.5" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">«Recurso de Apelación» y «recurso de apelación» son el mismo término para una persona,</text>
  <text x="425" y="420" text-anchor="middle" font-size="11.5" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">pero dos valores distintos para un cruce exacto: sin normalizar, no se reconocen como coincidentes.</text>

  <text x="450" y="480" text-anchor="middle" font-size="10.5" fill="#7A6F5C" font-style="italic" font-family="Arial, Helvetica, sans-serif">© Dra. Blanca Hernández Pardo · Datos Masivos · Unidad 5 — recreación del diagrama real del manual</text>
</svg>
