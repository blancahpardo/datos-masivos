<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="900" height="620" fill="#F1E7D6"/>
  <rect x="18" y="18" width="864" height="584" fill="none" stroke="#B5A88F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="450" y="58" text-anchor="middle" font-size="13" letter-spacing="3" fill="#A23B2E" font-family="Arial, Helvetica, sans-serif" font-weight="bold">LAS TRES UVES · LANEY (2001)</text>
  <text x="450" y="92" text-anchor="middle" font-size="24" fill="#1E1812" font-weight="bold">¿Cuándo un archivo es un problema de datos masivos?</text>

  <!-- Volumen -->
  <g>
    <circle cx="185" cy="280" r="118" fill="#D2652F" fill-opacity="0.15" stroke="#D2652F" stroke-width="2.5"/>
    <text x="185" y="242" text-anchor="middle" font-size="34">📦</text>
    <text x="185" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#A23B2E">VOLUMEN</text>
    <text x="185" y="303" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">cantidad de datos que hay</text>
    <text x="185" y="319" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">que almacenar y procesar</text>
  </g>

  <!-- Variedad -->
  <g>
    <circle cx="450" cy="280" r="118" fill="#4F7A57" fill-opacity="0.15" stroke="#4F7A57" stroke-width="2.5"/>
    <text x="450" y="242" text-anchor="middle" font-size="34">🧩</text>
    <text x="450" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#3E6146">VARIEDAD</text>
    <text x="450" y="303" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">diversidad de formatos,</text>
    <text x="450" y="319" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">estructuras y fuentes</text>
  </g>

  <!-- Velocidad -->
  <g>
    <circle cx="715" cy="280" r="118" fill="#1E1812" fill-opacity="0.08" stroke="#1E1812" stroke-width="2.5"/>
    <text x="715" y="242" text-anchor="middle" font-size="34">⏱️</text>
    <text x="715" y="278" text-anchor="middle" font-size="19" font-weight="bold" fill="#1E1812">VELOCIDAD</text>
    <text x="715" y="303" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">ritmo al que se generan,</text>
    <text x="715" y="319" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">necesitan o actualizan</text>
  </g>

  <text x="317.5" y="288" text-anchor="middle" font-size="22" fill="#7A6F5C" font-family="Arial, Helvetica, sans-serif">+</text>
  <text x="582.5" y="288" text-anchor="middle" font-size="22" fill="#7A6F5C" font-family="Arial, Helvetica, sans-serif">+</text>

  <rect x="130" y="470" width="640" height="72" rx="4" fill="#1E1812"/>
  <text x="450" y="498" text-anchor="middle" font-size="13" fill="#F1E7D6" font-weight="bold" font-family="Arial, Helvetica, sans-serif">Ninguna de las tres, por separado, decide nada.</text>
  <text x="450" y="520" text-anchor="middle" font-size="12" fill="#D9CBB0" font-family="Arial, Helvetica, sans-serif">Hay que mirarlas juntas para diagnosticar el caso de Ágora FM.</text>

  <text x="450" y="588" text-anchor="middle" font-size="10.5" fill="#7A6F5C" font-style="italic" font-family="Arial, Helvetica, sans-serif">© Dra. Blanca Hernández Pardo · Datos Masivos · Unidad 1 — elaboración propia a partir de Laney (2001)</text>
</svg>
