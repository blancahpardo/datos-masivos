<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="440" fill="#F1E7D6"/>
  <rect x="16" y="16" width="668" height="408" fill="none" stroke="#B5A88F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="350" y="50" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#A23B2E" font-family="Arial, Helvetica, sans-serif" font-weight="bold">EJEMPLO ILUSTRATIVO</text>
  <text x="350" y="78" text-anchor="middle" font-size="20" fill="#1E1812" font-weight="bold">Boxplot: longitud de texto según es_retuit</text>
  <line x1="80" y1="340" x2="620" y2="340" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="80" y1="120" x2="80" y2="340" stroke="#3A322A" stroke-width="1.5"/>
  <!-- box 1: False -->
  <line x1="230" y1="150" x2="230" y2="320" stroke="#3A322A" stroke-width="1.5"/>
  <rect x="190" y="210" width="80" height="70" fill="#4F7A57" fill-opacity="0.35" stroke="#3E6146" stroke-width="2"/>
  <line x1="190" y1="240" x2="270" y2="240" stroke="#3E6146" stroke-width="2.5"/>
  <line x1="210" y1="150" x2="250" y2="150" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="210" y1="320" x2="250" y2="320" stroke="#3A322A" stroke-width="1.5"/>
  <text x="230" y="360" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">False</text>
  <!-- box 2: True, shorter and more compact -->
  <line x1="450" y1="190" x2="450" y2="300" stroke="#3A322A" stroke-width="1.5"/>
  <rect x="410" y="225" width="80" height="45" fill="#D2652F" fill-opacity="0.35" stroke="#A23B2E" stroke-width="2"/>
  <line x1="410" y1="248" x2="490" y2="248" stroke="#A23B2E" stroke-width="2.5"/>
  <line x1="430" y1="190" x2="470" y2="190" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="430" y1="300" x2="470" y2="300" stroke="#3A322A" stroke-width="1.5"/>
  <circle cx="450" cy="160" r="3.5" fill="#A23B2E"/>
  <text x="450" y="360" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">True (retuit)</text>
  <text x="45" y="230" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif" transform="rotate(-90 45 230)">longitud_texto</text>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" fill="#7A6F5C" font-style="italic" font-family="Arial, Helvetica, sans-serif">© Dra. Blanca Hernández Pardo · Datos Masivos · Unidad 3 — datos sintéticos de ejemplo, elaboración propia</text>
</svg>
