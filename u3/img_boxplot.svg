<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="440" fill="#F1E7D6"/>
  <rect x="16" y="16" width="668" height="408" fill="none" stroke="#B5A88F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="350" y="46" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#A23B2E" font-family="Arial, Helvetica, sans-serif" font-weight="bold">DATOS REALES DE LA PRÁCTICA</text>
  <text x="350" y="74" text-anchor="middle" font-size="20" fill="#1E1812" font-weight="bold">Boxplot: longitud_texto según es_retuit</text>
  <!-- scale: value v -> y = 340 - v*(240/290) approx, range 0-290 -->
  <line x1="90" y1="340" x2="640" y2="340" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="90" y1="100" x2="90" y2="340" stroke="#3A322A" stroke-width="1.5"/>
  <text x="80" y="344" text-anchor="end" font-size="10" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">0</text>
  <text x="80" y="240" text-anchor="end" font-size="10" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">150</text>
  <text x="80" y="135" text-anchor="end" font-size="10" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">280</text>

  <!-- False: whisk 10-225, box 78-142, median 114 -->
  <line x1="230" y1="153" x2="230" y2="331" stroke="#3A322A" stroke-width="1.5"/>
  <rect x="180" y="222" width="100" height="56" fill="#3A322A" fill-opacity="0.75" stroke="#1E1812" stroke-width="2"/>
  <line x1="180" y1="246" x2="280" y2="246" stroke="#F1E7D6" stroke-width="2.5"/>
  <line x1="205" y1="153" x2="255" y2="153" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="205" y1="331" x2="255" y2="331" stroke="#3A322A" stroke-width="1.5"/>
  <text x="230" y="365" text-anchor="middle" font-size="13" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">False</text>

  <!-- True: whisk 90-258 with outliers 270,278,283, box 142-190, median 172, low outlier 33 -->
  <line x1="470" y1="197" x2="470" y2="267" stroke="#3A322A" stroke-width="1.5"/>
  <rect x="420" y="184" width="100" height="40" fill="#D2652F" fill-opacity="0.55" stroke="#A23B2E" stroke-width="2"/>
  <line x1="420" y1="197" x2="520" y2="197" stroke="#1E1812" stroke-width="2.5"/>
  <line x1="445" y1="126" x2="495" y2="126" stroke="#3A322A" stroke-width="1.5"/>
  <line x1="445" y1="267" x2="495" y2="267" stroke="#3A322A" stroke-width="1.5"/>
  <circle cx="470" cy="106" r="4" fill="none" stroke="#A23B2E" stroke-width="1.5"/>
  <circle cx="470" cy="100" r="4" fill="none" stroke="#A23B2E" stroke-width="1.5"/>
  <circle cx="470" cy="94" r="4" fill="none" stroke="#A23B2E" stroke-width="1.5"/>
  <circle cx="470" cy="308" r="4" fill="none" stroke="#A23B2E" stroke-width="1.5"/>
  <text x="470" y="365" text-anchor="middle" font-size="13" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">True (retuit)</text>

  <text x="35" y="220" text-anchor="middle" font-size="12" fill="#3A322A" font-family="Arial, Helvetica, sans-serif" transform="rotate(-90 35 220)">longitud_texto</text>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" fill="#7A6F5C" font-style="italic" font-family="Arial, Helvetica, sans-serif">© Dra. Blanca Hernández Pardo · Datos Masivos · Unidad 3 — recreación del boxplot real del cuaderno</text>
</svg>
