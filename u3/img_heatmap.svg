    <rect x="520" y="155" width="120" height="50" fill="#EAD9BE"/><text x="580" y="185" text-anchor="middle" fill="#1E1812">0.08</text>

    <rect x="160" y="205" width="120" height="50" fill="#D9CBB0"/><text x="220" y="235" text-anchor="middle" fill="#1E1812">0.19</text>
    <rect x="280" y="205" width="120" height="50" fill="#A23B2E"/><text x="340" y="235" text-anchor="middle" fill="#fff">1.00</text>
    <rect x="400" y="205" width="120" height="50" fill="#FFFFFF" stroke="#B5A88F" stroke-width="1"/><text x="460" y="235" text-anchor="middle" fill="#1E1812">-0.04</text>
    <rect x="520" y="205" width="120" height="50" fill="#FFFFFF" stroke="#B5A88F" stroke-width="1"/><text x="580" y="235" text-anchor="middle" fill="#1E1812">-0.01</text>

    <rect x="160" y="255" width="120" height="50" fill="#FFFFFF" stroke="#B5A88F" stroke-width="1"/><text x="220" y="285" text-anchor="middle" fill="#1E1812">-0.02</text>
    <rect x="280" y="255" width="120" height="50" fill="#FFFFFF" stroke="#B5A88F" stroke-width="1"/><text x="340" y="285" text-anchor="middle" fill="#1E1812">-0.04</text>
    <rect x="400" y="255" width="120" height="50" fill="#A23B2E"/><text x="460" y="285" text-anchor="middle" fill="#fff">1.00</text>
    <rect x="520" y="255" width="120" height="50" fill="#E4D2B8"/><text x="580" y="285" text-anchor="middle" fill="#1E1812">0.12</text>

    <rect x="160" y="305" width="120" height="50" fill="#EAD9BE"/><text x="220" y="335" text-anchor="middle" fill="#1E1812">0.08</text>
