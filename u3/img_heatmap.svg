<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif">
  <rect width="700" height="440" fill="#F1E7D6"/>
  <rect x="16" y="16" width="668" height="408" fill="none" stroke="#B5A88F" stroke-width="1.5" stroke-dasharray="4 5"/>
  <text x="350" y="46" text-anchor="middle" font-size="12" letter-spacing="2.5" fill="#A23B2E" font-family="Arial, Helvetica, sans-serif" font-weight="bold">DATOS REALES DE LA PRÁCTICA</text>
  <text x="350" y="74" text-anchor="middle" font-size="20" fill="#1E1812" font-weight="bold">Heatmap de correlaciones</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="10.5" fill="#1E1812">
    <text x="200" y="140" text-anchor="middle">longitud_texto</text>
    <text x="320" y="140" text-anchor="middle">num_hashtags</text>
    <text x="440" y="140" text-anchor="middle">num_menciones</text>
    <text x="560" y="140" text-anchor="middle">num_urls</text>
    <text x="150" y="180" text-anchor="end">longitud_texto</text>
    <text x="150" y="230" text-anchor="end">num_hashtags</text>
    <text x="150" y="280" text-anchor="end">num_menciones</text>
    <text x="150" y="330" text-anchor="end">num_urls</text>
  </g>
  <!-- values row-major: [1.00,.19,-.02,.08][.19,1.00,-.04,-.01][-.02,-.04,1.00,.12][.08,-.01,.12,1.00] -->
  <g stroke="#F1E7D6" stroke-width="2" font-family="Arial, Helvetica, sans-serif" font-size="13">
    <rect x="160" y="155" width="120" height="50" fill="#A23B2E"/><text x="220" y="185" text-anchor="middle" fill="#fff">1.00</text>
    <rect x="280" y="155" width="120" height="50" fill="#D9CBB0"/><text x="340" y="185" text-anchor="middle" fill="#1E1812">0.19</text>
