  <text x="350" y="385" text-anchor="middle" font-size="11" fill="#3A322A" font-family="Arial, Helvetica, sans-serif">rojo = correlación fuerte (misma variable) · claro = correlación débil o nula</text>
  <text x="350" y="410" text-anchor="middle" font-size="10.5" fill="#7A6F5C" font-style="italic" font-family="Arial, Helvetica, sans-serif">© Dra. Blanca Hernández Pardo · Datos Masivos · Unidad 3 — recreación del heatmap real del cuaderno</text>
